services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasktracker_db
      POSTGRES_USER: tasktracker_user
      POSTGRES_PASSWORD: tasktracker_password
    ports:
      - "5432:5432"
    volumes:
      - tasktracker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasktracker_user -d tasktracker_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: tasktracker_db
      DB_USER: tasktracker_user
      DB_PASSWORD: tasktracker_password
      JWT_SECRET: tasktracker-development-secret
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  tasktracker-postgres-data:
