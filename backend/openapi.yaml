openapi: 3.0.3

info: # basic info about the yaml description
  title: TaskTracker API
  version: 1.0.0
  description: REST API documentation for the TaskTracker application.

servers:
  - url: http://localhost:3000

paths: # this is the key and all the api down are its values
  /api/auth/register:
    post:
      summary: Register a new user
      description: Creates a new TaskTracker user account.
      tags:
        - Authentication
      requestBody:
        required: true # this endpoint expects data to be sent in the http req
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Ahmed Khaled
                email:
                  type: string
                  format: email
                  example: ahmedk.marzouk2006@gmail.com
                password:
                  type: string
                  example: Password123
      responses:
        "201":
          description: User registered successfully
        "400":
          description: Invalid registration data
        "500":
          description: Internal server error

  /api/auth/login:
    post:
      summary: Log in a user
      description: Authenticates a user and returns a JWT token.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: ahmedk.marzouk2006@gmail.com
                password:
                  type: string
                  example: Password123
      responses:
        "200":
          description: Login successful
        "400":
          description: Invalid login data
        "401":
          description: Invalid email or password
        "500":
          description: Internal server error

  /api/auth/me:
    get:
      summary: Get the current user
      description: Returns the currently authenticated user.
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user returned successfully
        "401":
          description: Unauthorized
        "404":
          description: User not found
        "500":
          description: Internal server error

  /api/projects:
    get:
      summary: Get all projects
      description: Returns all projects that belong to the currently authenticated user.
      tags:
        - Projects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Projects returned successfully
        "401":
          description: Unauthorized
        "500":
          description: Internal server error

    post:
      summary: Create a project
      description: Creates a new project for the currently authenticated user.
      tags:
        - Projects
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Internship Project
                description:
                  type: string
                  example: Tasks for my internship project.
      responses:
        "201":
          description: Project created successfully
        "400":
          description: Invalid project data
        "401":
          description: Unauthorized
        "500":
          description: Internal server error

  /api/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the project

    put:
      summary: Update a project
      description: Updates an existing project owned by the authenticated user.
      tags:
        - Projects
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Updated Internship Project
                description:
                  type: string
                  example: Updated project description.
      responses:
        "200":
          description: Project updated successfully
        "400":
          description: Invalid project data
        "401":
          description: Unauthorized
        "404":
          description: Project not found
        "500":
          description: Internal server error

    delete:
      summary: Delete a project
      description: Deletes an existing project owned by the authenticated user.
      tags:
        - Projects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project deleted successfully
        "401":
          description: Unauthorized
        "404":
          description: Project not found
        "500":
          description: Internal server error

  /api/projects/{projectId}/tasks:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the project

    get:
      summary: Get tasks for a project
      description: Returns tasks for a project owned by the authenticated user.
      tags:
        - Tasks
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search by task title or description
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - To Do
              - In Progress
              - Done
          description: Filter by task status
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum:
              - Low
              - Medium
              - High
          description: Filter by task priority
        - name: overdue
          in: query
          required: false
          schema:
            type: boolean
          description: When true, returns only overdue tasks
      responses:
        "200":
          description: Tasks returned successfully
        "401":
          description: Unauthorized
        "404":
          description: Project not found
        "500":
          description: Internal server error

    post:
      summary: Create a task
      description: Creates a task inside the selected project.
      tags:
        - Tasks
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - status
                - priority
              properties:
                title:
                  type: string
                  example: Finish Swagger documentation
                description:
                  type: string
                  example: Document all protected API routes.
                status:
                  type: string
                  enum:
                    - To Do
                    - In Progress
                    - Done
                  example: To Do
                priority:
                  type: string
                  enum:
                    - Low
                    - Medium
                    - High
                  example: Medium
                estimatedMinutes:
                  type: integer
                  nullable: true
                  example: 120
                dueDate:
                  type: string
                  format: date
                  nullable: true
                  example: "2026-08-20"
      responses:
        "201":
          description: Task created successfully
        "400":
          description: Invalid task data
        "401":
          description: Unauthorized
        "404":
          description: Project not found
        "500":
          description: Internal server error

  /api/projects/{projectId}/tasks/{taskId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the project
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the task

    get:
      summary: Get one task
      description: Returns one specific task inside the selected project.
      tags:
        - Tasks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Task returned successfully
        "401":
          description: Unauthorized
        "404":
          description: Task or project not found
        "500":
          description: Internal server error

    put:
      summary: Update a task
      description: Updates an existing task inside the selected project.
      tags:
        - Tasks
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - status
                - priority
              properties:
                title:
                  type: string
                  example: Finish Swagger documentation
                description:
                  type: string
                  example: Document all protected API routes and statuses.
                status:
                  type: string
                  enum:
                    - To Do
                    - In Progress
                    - Done
                  example: In Progress
                priority:
                  type: string
                  enum:
                    - Low
                    - Medium
                    - High
                  example: High
                estimatedMinutes:
                  type: integer
                  nullable: true
                  example: 180
                dueDate:
                  type: string
                  format: date
                  nullable: true
                  example: "2026-08-21"
      responses:
        "200":
          description: Task updated successfully
        "400":
          description: Invalid task data
        "401":
          description: Unauthorized
        "404":
          description: Task or project not found
        "500":
          description: Internal server error

    delete:
      summary: Delete a task
      description: Permanently deletes an existing task inside the selected project.
      tags:
        - Tasks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Task deleted successfully
        "401":
          description: Unauthorized
        "404":
          description: Task or project not found
        "500":
          description: Internal server error

  /api/projects/{projectId}/tasks/{taskId}/time-entries:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the project
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the task

    get:
      summary: Get time entries
      description: Returns all time entries for one task together with logged-time totals.
      tags:
        - Time Entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Time entries returned successfully
        "401":
          description: Unauthorized
        "404":
          description: Task or project not found
        "500":
          description: Internal server error

    post:
      summary: Create a time entry
      description: Creates a new time entry for one task.
      tags:
        - Time Entries
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - durationHours
                - date
              properties:
                durationHours:
                  type: number
                  format: double
                  example: 1.5
                date:
                  type: string
                  format: date
                  example: "2026-08-18"
                note:
                  type: string
                  example: Worked on Swagger documentation.
      responses:
        "201":
          description: Time entry created successfully
        "400":
          description: Invalid time-entry data
        "401":
          description: Unauthorized
        "404":
          description: Task or project not found
        "500":
          description: Internal server error

  /api/projects/{projectId}/tasks/{taskId}/time-entries/{timeEntryId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the project
      - name: taskId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the task
      - name: timeEntryId
        in: path
        required: true
        schema:
          type: integer
        description: ID of the time entry

    put:
      summary: Update a time entry
      description: Updates an existing time entry for one task.
      tags:
        - Time Entries
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - durationHours
                - date
              properties:
                durationHours:
                  type: number
                  format: double
                  example: 2
                date:
                  type: string
                  format: date
                  example: "2026-08-18"
                note:
                  type: string
                  example: Updated the Swagger documentation.
      responses:
        "200":
          description: Time entry updated successfully
        "400":
          description: Invalid time-entry data
        "401":
          description: Unauthorized
        "404":
          description: Time entry, task, or project not found
        "500":
          description: Internal server error

    delete:
      summary: Delete a time entry
      description: Permanently deletes an existing time entry.
      tags:
        - Time Entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Time entry deleted successfully
        "401":
          description: Unauthorized
        "404":
          description: Time entry, task, or project not found
        "500":
          description: Internal server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT