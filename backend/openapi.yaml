openapi: 3.0.3

info: # basic info about the yaml description
  title: TaskTracker API
  version: 1.0.0
  description: REST API documentation for the TaskTracker application.

servers:
  - url: http://localhost:3000 

paths: # this is the key and all the api down are its values
  /api/auth/register:
    post:
      summary: Register a new user
      description: Creates a new TaskTracker user account.
      tags:
        - Authentication
      requestBody:
        required: true #this endpoints expects data to be sent in the http req
        content: #type of data sent
          application/json:
            schema: # describe what is the json structure
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Ahmed Khaled
                email:
                  type: string
                  format: email
                  example: ahmedk.marzouk2006@gmail.com
                password:
                  type: string
                  example: Password123
      responses:
        "201":
          description: User registered successfully
        "400":
          description: Invalid registration data
        "500":
          description: Internal server error

  /api/auth/login:
    post:
      summary: Log in a user
      description: Authenticates a user and returns a JWT token.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: ahmedk.marzouk2006@gmail.com
                password:
                  type: string
                  example: Password123
      responses:
        "200":
          description: Login successful
        "400":
          description: Invalid login data
        "401":
          description: Invalid email or password
        "500":
          description: Internal server error

  /api/auth/me:
    get:
      summary: Get the current user
      description: Returns the currently authenticated user.
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user returned successfully
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT